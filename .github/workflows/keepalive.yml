# Supabase free tier pauses after ~7 idle days. Ping the prices function every 3 days.
name: keepalive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_FUNCTIONS_URL }}/prices" > /dev/null
